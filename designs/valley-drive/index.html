<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8bbfe0">
  <title>Valley drive — motion study</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #142f32; }
    body { min-height: 100svh; display: grid; place-items: center; font-family: system-ui, sans-serif; }
    .scene { position: relative; width: min(100vw, 177.68svh); aspect-ratio: 1672 / 941; overflow: hidden; isolation: isolate; }
    .landscape { position: absolute; width: 100%; height: 100%; inset: 0; }
    .journey { position: absolute; width: 100%; height: 100%; inset: 0; animation: drive 24s linear infinite; animation-delay: -10s; }
    .car { position: absolute; width: 18%; left: 48%; bottom: 17.1%; animation: suspension 800ms ease-in-out infinite alternate; }
    .car img { display: block; width: 100%; filter: drop-shadow(0 3px 2px rgb(44 39 22 / 24%)); }
    .controls { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: 16px; z-index: 2; display: flex; gap: 8px; }
    button { border: 1px solid #d9d9bd; border-radius: 24px; min-height: 44px; padding: 10px 18px; color: #233b30; background: #fff9e8; font: 500 14px system-ui, sans-serif; cursor: pointer; box-shadow: 0 2px 10px #142f3220; }
    button:focus-visible { outline: 3px solid #fff9e8; outline-offset: 4px; }
    .paused .journey, .paused .car { animation-play-state: paused; }
    .hide-controls .controls { opacity: 0; pointer-events: none; }
    .hide-controls:focus-within .controls { opacity: 1; pointer-events: auto; }
    @keyframes drive { from { transform: translateX(72%); } to { transform: translateX(-72%); } }
    @keyframes suspension { from { transform: translateY(0) rotate(-.12deg); } to { transform: translateY(-1px) rotate(.12deg); } }
    @media (prefers-reduced-motion: reduce) { .journey, .car { animation: none; } }
    @media (hover: hover) and (pointer: fine) { button:hover { background: #f0e8cd; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="A painted alpine valley with a small yellow car travelling along a country road.">
    <img class="landscape" src="assets/valley.png" alt="Snowcapped blue mountains above green meadows, a red farmhouse, a country road and foreground wildflowers." fetchpriority="high">
    <div class="journey" aria-hidden="true"><div class="car"><img src="assets/car.png" alt=""></div></div>
  </main>
  <div class="controls" aria-label="Preview controls">
    <button id="pause" type="button" aria-pressed="false">Pause motion</button>
    <button id="hide" type="button">Hide controls</button>
  </div>
  <script>
    const pause = document.querySelector('#pause');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    function updateReduced() {
      if (reduced.matches) {
        document.body.classList.add('paused');
        pause.textContent = 'Motion reduced';
        pause.disabled = true;
        pause.setAttribute('aria-pressed', 'true');
      } else {
        pause.disabled = false;
        pause.textContent = document.body.classList.contains('paused') ? 'Resume motion' : 'Pause motion';
      }
    }
    updateReduced();
    reduced.addEventListener('change', updateReduced);
    pause.addEventListener('click', () => {
      const paused = document.body.classList.toggle('paused');
      pause.setAttribute('aria-pressed', String(paused));
      pause.textContent = paused ? 'Resume motion' : 'Pause motion';
    });
    document.querySelector('#hide').addEventListener('click', event => {
      event.currentTarget.blur();
      document.body.classList.add('hide-controls');
    });
    document.addEventListener('pointerdown', event => {
      if (!event.target.closest('button')) document.body.classList.remove('hide-controls');
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.body.classList.remove('hide-controls');
    });
  </script>
</body>
</html>
